[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer67"
version = "0.1.0"
description = "Reviewer67 — pre-submission paper review tool grounded in real OpenReview data. Mines reviewer rejection patterns and runs a persona-conditioned LLM panel against your paper."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openreview-py>=1.45",
    "anthropic>=0.40",
    "openai>=1.50",
    "tqdm>=4.66",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "hdbscan>=0.8.33",
    "scipy>=1.11",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
reviewer67 = "paper_reviewer.cli:main"
paper-reviewer = "paper_reviewer.cli:main"  # legacy alias

[tool.setuptools.packages.find]
where = ["src"]
