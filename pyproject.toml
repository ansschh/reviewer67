[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reviewer"
version = "0.1.0"
description = "Scrape OpenReview, mine reviewer rejection patterns, and run a multi-agent LLM review panel against your paper before submission."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "openreview-py>=1.45",
    "anthropic>=0.40",
    "openai>=1.50",
    "tqdm>=4.66",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "hdbscan>=0.8.33",
    "scipy>=1.11",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
paper-reviewer = "paper_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
